<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" role="img"><title>Three reads of the interlocking fret</title><desc>Colored paths distinguish whole-band glide symmetry, diagonal correspondence of directions, and a scaled cap requiring cuts.</desc><rect width="900" height="720" fill="#fcfaf3" /><g font-family="Segoe UI, Arial, sans-serif"><text x="26" y="38" font-size="29" fill="#263b37" font-weight="bold">Three reads of the same fret</text><text x="26" y="65" font-size="16" fill="#58665d" font-weight="normal">One tracing, viewed through the whole band, ordered directions and partial spans.</text><line x1="26" y1="83" x2="874" y2="83" stroke="#bac4bc" /><text x="26" y="111" font-size="21" fill="#263b37" font-weight="bold">The band repeats and mirrors</text><text x="26" y="135" font-size="16" fill="#263b37" font-weight="normal">The copper half repeats the green half four ticks right and on the other side of the midline.</text><g><polyline points="45.00,239.00 115.00,239.00 115.00,179.00 75.00,179.00 75.00,199.00 95.00,199.00 95.00,219.00 55.00,219.00 55.00,159.00 195.00,159.00 195.00,219.00 155.00,219.00 155.00,199.00 175.00,199.00 175.00,179.00 135.00,179.00 135.00,239.00 275.00,239.00 275.00,179.00 235.00,179.00 235.00,199.00 255.00,199.00 255.00,219.00 215.00,219.00 215.00,159.00 355.00,159.00 355.00,219.00 315.00,219.00 315.00,199.00 335.00,199.00 335.00,179.00 295.00,179.00 295.00,239.00 435.00,239.00 435.00,179.00 395.00,179.00 395.00,199.00 415.00,199.00 415.00,219.00 375.00,219.00 375.00,159.00 515.00,159.00 515.00,219.00 475.00,219.00 475.00,199.00 495.00,199.00 495.00,179.00 455.00,179.00 455.00,239.00 595.00,239.00 595.00,179.00 555.00,179.00 555.00,199.00 575.00,199.00 575.00,219.00 535.00,219.00 535.00,159.00 675.00,159.00 675.00,219.00 635.00,219.00 635.00,199.00 655.00,199.00 655.00,179.00 615.00,179.00 615.00,239.00 755.00,239.00 755.00,179.00 715.00,179.00 715.00,199.00 735.00,199.00 735.00,219.00 695.00,219.00 695.00,159.00 835.00,159.00 835.00,219.00 795.00,219.00 795.00,199.00 815.00,199.00 815.00,179.00 775.00,179.00 775.00,239.00 845.00,239.00" fill="none" stroke="#bac4bc" stroke-width="4" stroke-linejoin="round" stroke-linecap="butt" /><polyline points="215.00,159.00 355.00,159.00 355.00,219.00 315.00,219.00 315.00,199.00 335.00,199.00 335.00,179.00 295.00,179.00 295.00,239.00" fill="none" stroke="#186c61" stroke-width="4" stroke-linejoin="round" stroke-linecap="butt" /><polyline points="295.00,239.00 435.00,239.00 435.00,179.00 395.00,179.00 395.00,199.00 415.00,199.00 415.00,219.00 375.00,219.00 375.00,159.00" fill="none" stroke="#ae502e" stroke-width="4" stroke-linejoin="round" stroke-linecap="butt" /></g><path d="M445,149 L445,153 M445,157 L445,161 M445,165 L445,169 M445,173 L445,177 M445,181 L445,185 M445,189 L445,193 M445,197 L445,201 M445,205 L445,209 M445,213 L445,217 M445,221 L445,225 M445,229 L445,233 M445,237 L445,241 M445,245 L445,249" stroke="#58665d" stroke-width="1" /><path d="M45,199 L49,199 M53,199 L57,199 M61,199 L65,199 M69,199 L73,199 M77,199 L81,199 M85,199 L89,199 M93,199 L97,199 M101,199 L105,199 M109,199 L113,199 M117,199 L121,199 M125,199 L129,199 M133,199 L137,199 M141,199 L145,199 M149,199 L153,199 M157,199 L161,199 M165,199 L169,199 M173,199 L177,199 M181,199 L185,199 M189,199 L193,199 M197,199 L201,199 M205,199 L209,199 M213,199 L217,199 M221,199 L225,199 M229,199 L233,199 M237,199 L241,199 M245,199 L249,199 M253,199 L257,199 M261,199 L265,199 M269,199 L273,199 M277,199 L281,199 M285,199 L289,199 M293,199 L297,199 M301,199 L305,199 M309,199 L313,199 M317,199 L321,199 M325,199 L329,199 M333,199 L337,199 M341,199 L345,199 M349,199 L353,199 M357,199 L361,199 M365,199 L369,199 M373,199 L377,199 M381,199 L385,199 M389,199 L393,199 M397,199 L401,199 M405,199 L409,199 M413,199 L417,199 M421,199 L425,199 M429,199 L433,199 M437,199 L441,199 M445,199 L449,199 M453,199 L457,199 M461,199 L465,199 M469,199 L473,199 M477,199 L481,199 M485,199 L489,199 M493,199 L497,199 M501,199 L505,199 M509,199 L513,199 M517,199 L521,199 M525,199 L529,199 M533,199 L537,199 M541,199 L545,199 M549,199 L553,199 M557,199 L561,199 M565,199 L569,199 M573,199 L577,199 M581,199 L585,199 M589,199 L593,199 M597,199 L601,199 M605,199 L609,199 M613,199 L617,199 M621,199 L625,199 M629,199 L633,199 M637,199 L641,199 M645,199 L649,199 M653,199 L657,199 M661,199 L665,199 M669,199 L673,199 M677,199 L681,199 M685,199 L689,199 M693,199 L697,199 M701,199 L705,199 M709,199 L713,199 M717,199 L721,199 M725,199 L729,199 M733,199 L737,199 M741,199 L745,199 M749,199 L753,199 M757,199 L761,199 M765,199 L769,199 M773,199 L777,199 M781,199 L785,199 M789,199 L793,199 M797,199 L801,199 M805,199 L809,199 M813,199 L817,199 M821,199 L825,199 M829,199 L833,199 M837,199 L841,199" stroke="#58665d" stroke-width="1" /><text x="26" y="276" font-size="15" fill="#58665d" font-weight="normal">Vertical dash: central mirror.     Horizontal dash: glide midline.     One full repeat: 8 ticks.</text><line x1="26" y1="297" x2="874" y2="297" stroke="#bac4bc" /><text x="26" y="325" font-size="21" fill="#263b37" font-weight="bold">A diagonal correspondence in the turn order</text><text x="26" y="348" font-size="16" fill="#263b37" font-weight="normal">Exchange horizontal and vertical directions. The eight arrows correspond; their reaches differ.</text><polyline points="112.50,393.50 112.50,376.50 78.50,376.50 78.50,427.50 197.50,427.50 197.50,376.50 163.50,376.50 163.50,393.50 180.50,393.50" fill="none" stroke="#186c61" stroke-width="4" stroke-linejoin="round" stroke-linecap="butt" /><circle cx="112.5" cy="393.5" r="4.5" fill="#fcfaf3" stroke="#186c61" stroke-width="2" /><text x="242" y="395" font-size="16" fill="#186c61" font-weight="bold">Start at stroke 6</text><text x="242" y="421" font-size="14" fill="#263b37" font-weight="normal">N W S E N W S E</text><polyline points="530.50,410.50 547.50,410.50 547.50,427.50 513.50,427.50 513.50,376.50 632.50,376.50 632.50,427.50 598.50,427.50 598.50,410.50" fill="none" stroke="#ae502e" stroke-width="4" stroke-linejoin="round" stroke-linecap="butt" /><circle cx="530.5" cy="410.5" r="4.5" fill="#fcfaf3" stroke="#ae502e" stroke-width="2" /><text x="677" y="395" font-size="16" fill="#ae502e" font-weight="bold">Start at stroke 13</text><text x="677" y="421" font-size="14" fill="#263b37" font-weight="normal">E S W N E S W N</text><text x="26" y="468" font-size="15" fill="#58665d" font-weight="normal">Open dot: start of the run. The two patches are drawn at the same scale.</text><line x1="26" y1="491" x2="874" y2="491" stroke="#bac4bc" /><text x="26" y="519" font-size="21" fill="#263b37" font-weight="bold">A scaled cap inside the ink</text><text x="26" y="543" font-size="16" fill="#263b37" font-weight="normal">Two cuts on the inner arms isolate a cap. A half-turn and a 7/2 enlargement match the outer cap.</text><polyline points="231.00,572.00 231.00,644.00 183.00,644.00 183.00,620.00" fill="none" stroke="#bac4bc" stroke-width="4" stroke-linejoin="round" stroke-linecap="butt" /><polyline points="231.00,623.43 231.00,644.00 183.00,644.00 183.00,623.43" fill="none" stroke="#186c61" stroke-width="4" stroke-linejoin="round" stroke-linecap="butt" /><circle cx="231.0" cy="623.4285714285714" r="4" fill="#fcfaf3" stroke="#186c61" stroke-width="2" /><circle cx="183.0" cy="623.4285714285714" r="4" fill="#fcfaf3" stroke="#186c61" stroke-width="2" /><polyline points="500.00,644.00 500.00,572.00 668.00,572.00 668.00,644.00" fill="none" stroke="#ae502e" stroke-width="4" stroke-linejoin="round" stroke-linecap="butt" /><text x="75" y="678" font-size="16" fill="#186c61" font-weight="normal">Inner cap with two new endpoints</text><text x="498" y="678" font-size="16" fill="#ae502e" font-weight="normal">Outer cap, three whole strokes</text><text x="26" y="706" font-size="15" fill="#58665d" font-weight="normal">Open dots: cuts. Gray: the unused parts of the inner arms.</text></g></svg>
