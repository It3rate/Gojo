<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 620 300' role='img'><title>Source support identities, not a measured arrangement</title><rect width='620' height='300' fill='#faf8ef'/><text x='25' y='30' font-family='system-ui,sans-serif' font-size='15' fill='#526b70'>Source passages · separate identity panels</text><rect x='25' y='55' width='270' height='175' rx='5' fill='#edf0e8' stroke='#c5d1c7'/><text x='41' y='82' font-family='system-ui,sans-serif' font-size='14' fill='#526b70'>Family A</text><line class='source-segment' x1='77' y1='125' x2='257' y2='125' stroke='#376b76' stroke-width='3.5'/><circle cx='77' cy='125' r='5' fill='#faf8ef' stroke='#376b76' stroke-width='2'/><circle cx='257' cy='125' r='5' fill='#faf8ef' stroke='#376b76' stroke-width='2'/><text x='40' y='130' font-family='system-ui,sans-serif' font-size='14' fill='#526b70'>A0</text><line class='source-segment' x1='77' y1='190' x2='257' y2='190' stroke='#376b76' stroke-width='3.5'/><circle cx='77' cy='190' r='5' fill='#faf8ef' stroke='#376b76' stroke-width='2'/><circle cx='257' cy='190' r='5' fill='#faf8ef' stroke='#376b76' stroke-width='2'/><text x='40' y='195' font-family='system-ui,sans-serif' font-size='14' fill='#526b70'>A1</text><rect x='325' y='55' width='270' height='175' rx='5' fill='#edf0e8' stroke='#c5d1c7'/><text x='341' y='82' font-family='system-ui,sans-serif' font-size='14' fill='#526b70'>Family B</text><line class='source-segment' x1='377' y1='125' x2='557' y2='125' stroke='#376b76' stroke-width='3.5'/><circle cx='377' cy='125' r='5' fill='#faf8ef' stroke='#376b76' stroke-width='2'/><circle cx='557' cy='125' r='5' fill='#faf8ef' stroke='#376b76' stroke-width='2'/><text x='340' y='130' font-family='system-ui,sans-serif' font-size='14' fill='#526b70'>B0</text><line class='source-segment' x1='377' y1='190' x2='557' y2='190' stroke='#376b76' stroke-width='3.5'/><circle cx='377' cy='190' r='5' fill='#faf8ef' stroke='#376b76' stroke-width='2'/><circle cx='557' cy='190' r='5' fill='#faf8ef' stroke='#376b76' stroke-width='2'/><text x='340' y='195' font-family='system-ui,sans-serif' font-size='14' fill='#526b70'>B1</text><text x='25' y='260' font-family='system-ui,sans-serif' font-size='12' fill='#748181'>Eight original endpoints · no published shared crossing sites</text><text x='25' y='280' font-family='system-ui,sans-serif' font-size='12' fill='#748181'>Panel layout is an index, not the geometric position of the supports.</text></svg>