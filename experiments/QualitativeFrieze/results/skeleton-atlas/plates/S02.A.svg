<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-label="S02.A Crossing families"><title>S02.A Crossing families</title><style>.ink,.second,.guide,.scaffold,.frame{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ink{stroke:#203e42}.second{stroke:#aa603f}
