<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 30' role='img'><title>W004 &#183; Broad occupied bands</title><desc>Filled supports with visible side edges. Accents follow the spine; depth masks preserve hidden passage structure. Artwork is a display read of native relations; clipping does not close an open path.</desc><rect x='0' y='0' width='42' height='30' fill='#fbf8ee'/><defs><clipPath id='viewport'><rect x='0' y='0' width='42' height='30'/></clipPath></defs><g clip-path='url(#viewport)' transform='translate(0 30) scale(1 -1)'><path class='ink occupied-support' data-role='occupied-support' d='M 5 4 C 5 17 20 29 33 29 L 33 23 C 20 23 11 17 11 4 Z' fill='#286672' fill-rule='nonzero' stroke='none' stroke-width='0' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title></title></path><path class='ink side-a' data-role='side-a' d='M 5 4 C 5 17 20 29 33 29' fill='none' fill-rule='nonzero' stroke='#213e43' stroke-width='0.14' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title></title></path><path class='ink side-b' data-role='side-b' d='M 11 4 C 11 17 20 23 33 23' fill='none' fill-rule='nonzero' stroke='#213e43' stroke-width='0.14' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title></title></path><path class='ink visible-cap' data-role='visible-cap' d='M 5 4 L 11 4' fill='none' fill-rule='nonzero' stroke='#213e43' stroke-width='0.14' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title></title></path><path class='ink visible-cap' data-role='visible-cap' d='M 33 29 L 33 23' fill='none' fill-rule='nonzero' stroke='#213e43' stroke-width='0.14' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title></title></path></g></svg>