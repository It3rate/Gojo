<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 30' role='img'><title>W011 &#183; Centre-path read</title><desc>Read the retained paths. Ordered underpasses show a small visibility gap; no path is deleted. Artwork is a display read of native relations; clipping does not close an open path.</desc><rect x='0' y='0' width='42' height='30' fill='#fbf8ee'/><defs><clipPath id='viewport'><rect x='0' y='0' width='42' height='30'/></clipPath><mask id='visibility-0' maskUnits='userSpaceOnUse' x='0' y='0' width='42' height='30'><rect x='0' y='0' width='42' height='30' fill='white'/><path d='M 21 1 L 21 29' fill='none' stroke='black' stroke-width='0.8' stroke-linecap='round' stroke-linejoin='round'/></mask></defs><g clip-path='url(#viewport)' transform='translate(0 30) scale(1 -1)'><path class='ink spine' data-role='spine' d='M 3 15 L 39 15' fill='none' fill-rule='nonzero' stroke='#286672' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1' mask='url(#visibility-0)'><title>Selected centre-path projection</title></path><path class='ink spine' data-role='spine' d='M 21 1 L 21 29' fill='none' fill-rule='nonzero' stroke='#b45b40' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Selected centre-path projection</title></path></g></svg>