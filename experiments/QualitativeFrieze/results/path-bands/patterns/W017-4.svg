<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 30' role='img'><title>W017 &#183; Decorated band read</title><desc>Filled supports with visible side edges. Accents follow the spine; depth masks preserve hidden passage structure. Artwork is a display read of native relations; clipping does not close an open path.</desc><rect x='0' y='0' width='42' height='30' fill='#fbf8ee'/><defs><clipPath id='viewport'><rect x='0' y='0' width='42' height='30'/></clipPath></defs><g clip-path='url(#viewport)' transform='translate(0 30) scale(1 -1)'><path class='ink occupied-support' data-role='occupied-support' d='M -8 7 C 6 8 28 34 50 29 L 50 23 C 34 22 12 -4 -8 1 Z' fill='#286672' fill-rule='nonzero' stroke='none' stroke-width='0' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title></title></path><path class='ink side-a' data-role='side-a' d='M -8 7 C 6 8 28 34 50 29' fill='none' fill-rule='nonzero' stroke='#213e43' stroke-width='0.14' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title></title></path><path class='ink side-b' data-role='side-b' d='M -8 1 C 12 -4 34 22 50 23' fill='none' fill-rule='nonzero' stroke='#213e43' stroke-width='0.14' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title></title></path><path class='ink spine-accent' data-role='spine-accent' d='M -8 4 C 9 2 31 28 50 26' fill='none' fill-rule='nonzero' stroke='#f2d693' stroke-width='0.2' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Accent follows the retained spine</title></path></g></svg>