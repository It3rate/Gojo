<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 30' role='img'><title>W006 &#183; Centre-path read</title><desc>Read the retained paths. Ordered underpasses show a small visibility gap; no path is deleted. Artwork is a display read of native relations; clipping does not close an open path.</desc><rect x='0' y='0' width='42' height='30' fill='#fbf8ee'/><defs><clipPath id='viewport'><rect x='0' y='0' width='42' height='30'/></clipPath></defs><g clip-path='url(#viewport)' transform='translate(0 30) scale(1 -1)'><path class='ink spine' data-role='spine' d='M 10 4 L 32 4' fill='none' fill-rule='nonzero' stroke='#286672' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Selected centre-path projection</title></path><path class='ink spine' data-role='spine' d='M 32 4 L 32 26' fill='none' fill-rule='nonzero' stroke='#286672' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Selected centre-path projection</title></path><path class='ink spine' data-role='spine' d='M 32 26 L 10 26' fill='none' fill-rule='nonzero' stroke='#286672' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Selected centre-path projection</title></path><path class='ink spine' data-role='spine' d='M 10 26 L 10 4' fill='none' fill-rule='nonzero' stroke='#286672' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Selected centre-path projection</title></path></g></svg>