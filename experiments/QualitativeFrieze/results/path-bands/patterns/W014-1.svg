<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 30' role='img'><title>W014 &#183; Centre-path read</title><desc>Read the retained paths. Ordered underpasses show a small visibility gap; no path is deleted. Artwork is a display read of native relations; clipping does not close an open path.</desc><rect x='0' y='0' width='42' height='30' fill='#fbf8ee'/><defs><clipPath id='viewport'><rect x='0' y='0' width='42' height='30'/></clipPath></defs><g clip-path='url(#viewport)' transform='translate(0 30) scale(1 -1)'><path class='ink spine' data-role='spine' d='M -6 7 L 7 7' fill='none' fill-rule='nonzero' stroke='#286672' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Selected centre-path projection</title></path><path class='ink spine' data-role='spine' d='M 7 7 L 7 23' fill='none' fill-rule='nonzero' stroke='#286672' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Selected centre-path projection</title></path><path class='ink spine' data-role='spine' d='M 7 23 L 21 23' fill='none' fill-rule='nonzero' stroke='#286672' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Selected centre-path projection</title></path><path class='ink spine' data-role='spine' d='M 21 23 L 21 7' fill='none' fill-rule='nonzero' stroke='#286672' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Selected centre-path projection</title></path><path class='ink spine' data-role='spine' d='M 21 7 L 35 7' fill='none' fill-rule='nonzero' stroke='#286672' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Selected centre-path projection</title></path><path class='ink spine' data-role='spine' d='M 35 7 L 35 23' fill='none' fill-rule='nonzero' stroke='#286672' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Selected centre-path projection</title></path><path class='ink spine' data-role='spine' d='M 35 23 L 48 23' fill='none' fill-rule='nonzero' stroke='#286672' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Selected centre-path projection</title></path></g></svg>