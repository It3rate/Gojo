<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 30' role='img'><title>W016 &#183; Decorated band read</title><desc>Filled supports with visible side edges. Accents follow the spine; depth masks preserve hidden passage structure. Artwork is a display read of native relations; clipping does not close an open path.</desc><rect x='0' y='0' width='42' height='30' fill='#fbf8ee'/><defs><clipPath id='viewport'><rect x='0' y='0' width='42' height='30'/></clipPath></defs><g clip-path='url(#viewport)' transform='translate(0 30) scale(1 -1)'><path class='ink occupied-support' data-role='occupied-support' d='M 4 5 C 6 23 19 26 38 25 L 38 25 C 31 8 18 5 4 5 Z' fill='#286672' fill-rule='nonzero' stroke='none' stroke-width='0' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title></title></path><path class='ink side-a' data-role='side-a' d='M 4 5 C 6 23 19 26 38 25' fill='none' fill-rule='nonzero' stroke='#213e43' stroke-width='0.14' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title></title></path><path class='ink side-b' data-role='side-b' d='M 4 5 C 18 5 31 8 38 25' fill='none' fill-rule='nonzero' stroke='#213e43' stroke-width='0.14' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title></title></path><path class='ink visible-cap' data-role='visible-cap' d='M 4 5 L 4 5' fill='none' fill-rule='nonzero' stroke='#213e43' stroke-width='0.14' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title></title></path><path class='ink visible-cap' data-role='visible-cap' d='M 38 25 L 38 25' fill='none' fill-rule='nonzero' stroke='#213e43' stroke-width='0.14' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title></title></path><path class='ink spine-accent' data-role='spine-accent' d='M 4 5 C 12 14 25 17 38 25' fill='none' fill-rule='nonzero' stroke='#f2d693' stroke-width='0.2' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Accent follows the retained spine</title></path></g></svg>