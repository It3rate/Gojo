<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 30' role='img'><title>W022 &#183; Centre-path read</title><desc>Read the retained paths. Ordered underpasses show a small visibility gap; no path is deleted. Artwork is a display read of native relations; clipping does not close an open path.</desc><rect x='0' y='0' width='42' height='30' fill='#fbf8ee'/><defs><clipPath id='viewport'><rect x='0' y='0' width='42' height='30'/></clipPath></defs><g clip-path='url(#viewport)' transform='translate(0 30) scale(1 -1)'><path class='ink spine' data-role='spine' d='M 21 18 C 19 23 20 26 21 28' fill='none' fill-rule='nonzero' stroke='#286672' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Selected centre-path projection</title></path><path class='ink spine' data-role='spine' d='M 18 18 C 11 21 9 25 8 28' fill='none' fill-rule='nonzero' stroke='#b45b40' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Selected centre-path projection</title></path><path class='ink spine' data-role='spine' d='M 18 15 C 13 13 10 14 8 15' fill='none' fill-rule='nonzero' stroke='#536b42' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Selected centre-path projection</title></path><path class='ink spine' data-role='spine' d='M 18 12 C 15 5 11 3 8 2' fill='none' fill-rule='nonzero' stroke='#806078' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Selected centre-path projection</title></path><path class='ink spine' data-role='spine' d='M 21 12 C 23 7 22 4 21 2' fill='none' fill-rule='nonzero' stroke='#286672' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Selected centre-path projection</title></path><path class='ink spine' data-role='spine' d='M 24 12 C 31 9 33 5 34 2' fill='none' fill-rule='nonzero' stroke='#b45b40' stroke-width='0.18' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title>Selecte