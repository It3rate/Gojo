<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 30' role='img'><title>W001 &#183; Paired boundaries</title><desc>Side A is blue; side B is rust. Only actual end caps are drawn. Pale support is a selected ruled construction. Artwork is a display read of native relations; clipping does not close an open path.</desc><rect x='0' y='0' width='42' height='30' fill='#fbf8ee'/><defs><clipPath id='viewport'><rect x='0' y='0' width='42' height='30'/></clipPath></defs><g clip-path='url(#viewport)' transform='translate(0 30) scale(1 -1)'><path class='ink occupied-support' data-role='occupied-support' d='M 3 17 L 39 17 L 39 11 L 3 11 Z' fill='#e5d9ba' fill-rule='nonzero' stroke='none' stroke-width='0' stroke-linecap='round' stroke-linejoin='round' opacity='0.28'><title></title></path><path class='ink side-a' data-role='side-a' d='M 3 17 L 39 17' fill='none' fill-rule='nonzero' stroke='#286672' stroke-width='0.14' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title></title></path><path class='ink side-b' data-role='side-b' d='M 3 11 L 39 11' fill='none' fill-rule='nonzero' stroke='#b45b40' stroke-width='0.14' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title></title></path><path class='ink visible-cap' data-role='visible-cap' d='M 3 17 L 3 11' fill='none' fill-rule='nonzero' stroke='#213e43' stroke-width='0.14' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title></title></path><path class='ink visible-cap' data-role='visible-cap' d='M 39 17 L 39 11' fill='none' fill-rule='nonzero' stroke='#213e43' stroke-width='0.14' stroke-linecap='round' stroke-linejoin='round' opacity='1'><title></title></path></g></svg>