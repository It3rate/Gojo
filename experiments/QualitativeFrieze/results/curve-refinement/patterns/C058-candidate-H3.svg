<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 300' role='img'><title>C058 &#183; Circular-like relative handles</title><desc>The receiver uses public cue bands and its own finite control construction. Join markers report supplied local reads; curve geometry is one display interpretation.</desc><rect width='420' height='300' fill='#fbf8ee'/><defs><marker id='arrow' markerWidth='6' markerHeight='6' refX='4' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0 0L6 3L0 6' fill='none' stroke='#929caa' stroke-width='1.1'/></marker></defs><path class='stroke' d='M138 150 C178 70 242 230 282 150' fill='none' stroke='#285762' stroke-width='3.8' stroke-linejoin='round' stroke-linecap='round'><title></title></path><g class='joint' data-mark='Open'><title>Open: Observed endpoint; continuation is not established.</title><path class='tangent-direction' d='M140.90688837 144.18622326L149.62755348 126.74489303' fill='none' stroke='#929caa' stroke-width='1.2' marker-end='url(#arrow)' opacity='.85'/><circle cx='138' cy='150' r='5.1' fill='#fbf8ee' stroke='#ab762e' stroke-width='2.2'/></g><g class='joint' data-mark='Open'><title>Open: Observed endpoint; continuation is not established.</title><path class='tangent-direction' d='M270.37244652 173.25510697L279.09311163 155.81377674' fill='none' stroke='#929caa' stroke-width='1.2' marker-end='url(#arrow)' opacity='.85'/><circle cx='282' cy='150' r='5.1' fill='#fbf8ee' stroke='#ab762e' stroke-width='2.2'/></g></svg>