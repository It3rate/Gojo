<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 300' role='img'><title>C016 &#183; Thin relative handles</title><desc>The receiver uses public cue bands and its own finite control construction. Join markers report supplied local reads; curve geometry is one display interpretation.</desc><rect width='420' height='300' fill='#fbf8ee'/><defs><marker id='arrow' markerWidth='6' markerHeight='6' refX='4' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0 0L6 3L0 6' fill='none' stroke='#929caa' stroke-width='1.1'/></marker></defs><path class='stroke' d='M60.66666667 262 C60.66666667 187.33333333 359.33333333 187.33333333 359.33333333 262' fill='none' stroke='#285762' stroke-width='3.8' stroke-linejoin='round' stroke-linecap='round'><title></title></path><path class='stroke' d='M359.33333333 262 L60.66666667 262' fill='none' stroke='#285762' stroke-width='3.8' stroke-linejoin='round' stroke-linecap='round'><title></title></path><g class='joint' data-mark='Open'><title>Open: Observed endpoint; continuation is not established.</title><path class='tangent-direction' d='M60.66666667 255.5L60.66666667 236' fill='none' stroke='#929caa' stroke-width='1.2' marker-end='url(#arrow)' opacity='.85'/><circle cx='60.66666667' cy='262' r='5.1' fill='#fbf8ee' stroke='#ab762e' stroke-width='2.2'/></g><g class='joint' data-mark='Corner'><title>Corner: Native forward tangent read: Corner</title><path class='tangent-direction' d='M359.33333333 236L359.33333333 255.5' fill='none' stroke='#929caa' stroke-width='1.2' marker-end='url(#arrow)' opacity='.85'/><path class='tangent-direction' d='M352.83333333 262L333.33333333 262' fill='none' stroke='#929caa' stroke-width='1.2' marker-end='url(#arrow)' opacity='.85'/><rect x='355.43333333' y='258.1' width='7.8' height='7.8' fill='#285762' stroke='#fbf8ee' stroke-width='1.1'/></g><g class='joint' data-mark='Open'><title>Open: Observed endpoint; continuation is not established.</title><path class='tangent-direction' d='M86.66666667 26