<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 300' role='img'><title>C010 &#183; Thin relative handles</title><desc>The receiver uses public cue bands and its own finite control construction. Join markers report supplied local reads; curve geometry is one display interpretation.</desc><rect width='420' height='300' fill='#fbf8ee'/><defs><marker id='arrow' markerWidth='6' markerHeight='6' refX='4' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0 0L6 3L0 6' fill='none' stroke='#929caa' stroke-width='1.1'/></marker></defs><path class='stroke' d='M135.33333333 150 C160.22222222 112.66666667 259.77777778 187.33333333 284.66666667 150' fill='none' stroke='#285762' stroke-width='3.8' stroke-linejoin='round' stroke-linecap='round'><title></title></path><g class='joint' data-mark='Open'><title>Open: Observed endpoint; continuation is not established.</title><path class='tangent-direction' d='M138.93888461 144.59167309L149.75553844 128.36669235' fill='none' stroke='#929caa' stroke-width='1.2' marker-end='url(#arrow)' opacity='.85'/><circle cx='135.33333333' cy='150' r='5.1' fill='#fbf8ee' stroke='#ab762e' stroke-width='2.2'/></g><g class='joint' data-mark='Open'><title>Open: Observed endpoint; continuation is not established.</title><path class='tangent-direction' d='M270.24446156 171.63330765L281.06111539 155.40832691' fill='none' stroke='#929caa' stroke-width='1.2' marker-end='url(#arrow)' opacity='.85'/><circle cx='284.66666667' cy='150' r='5.1' fill='#fbf8ee' stroke='#ab762e' stroke-width='2.2'/></g></svg>