<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 300' role='img'><title>C073 &#183; Earlier short-handle receiver</title><desc>The receiver uses public cue bands and its own finite control construction. Join markers report supplied local reads; curve geometry is one display interpretation.</desc><rect width='420' height='300' fill='#fbf8ee'/><defs><marker id='arrow' markerWidth='6' markerHeight='6' refX='4' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0 0L6 3L0 6' fill='none' stroke='#929caa' stroke-width='1.1'/></marker></defs><path class='stroke' d='M40 235 C40 197.22222222 172.22222222 65 210 65' fill='none' stroke='#285762' stroke-width='3.8' stroke-linejoin='round' stroke-linecap='round'><title></title></path><path class='stroke' d='M210 65 C210 102.77777778 342.22222222 235 380 235' fill='none' stroke='#285762' stroke-width='3.8' stroke-linejoin='round' stroke-linecap='round'><title></title></path><g class='joint' data-mark='Open'><title>Open: Observed endpoint; continuation is not established.</title><path class='tangent-direction' d='M40 228.5L40 209' fill='none' stroke='#929caa' stroke-width='1.2' marker-end='url(#arrow)' opacity='.85'/><circle cx='40' cy='235' r='5.1' fill='#fbf8ee' stroke='#ab762e' stroke-width='2.2'/></g><g class='joint' data-mark='Corner'><title>Corner: Native forward tangent read: Corner</title><path class='tangent-direction' d='M184 65L203.5 65' fill='none' stroke='#929caa' stroke-width='1.2' marker-end='url(#arrow)' opacity='.85'/><path class='tangent-direction' d='M210 71.5L210 91' fill='none' stroke='#929caa' stroke-width='1.2' marker-end='url(#arrow)' opacity='.85'/><rect x='206.1' y='61.1' width='7.8' height='7.8' fill='#285762' stroke='#fbf8ee' stroke-width='1.1'/></g><g class='joint' data-mark='Open'><title>Open: Observed endpoint; continuation is not established.</title><path class='tangent-direction' d='M354 235L373.5 235' fill='none' stroke='#929caa' stroke-width='1.2' marker-end='url(#arrow)' opacity='