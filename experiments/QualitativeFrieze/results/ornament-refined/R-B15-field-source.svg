<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 820' role='img' aria-label='B15 &#183; Fine lattice grain and guided leaves &#183; retained scaffold' data-collection='true' data-refined='true' data-focus='field' data-view='ornament' style='--ground:#F3EFE3;--field:#6D8058;--motif:#A34E53;--detail:#CDA76A;--gold:#B99C5B;--pale:#FFF8E6;--ink:#39483C;--band:17.882px;--detail-strength:1' data-source='B15' data-palette='Warm white, moss &amp; carmine'><title>B15 &#183; Fine lattice grain and guided leaves &#183; retained scaffold</title><style>
.ground{fill:var(--ground)}.base{fill:none;stroke:var(--gold);stroke-width:.85;opacity:.28}.layer{stroke-linecap:round;stroke-linejoin:round}
.edge{fill:none;stroke:var(--ink);stroke-width:calc(var(--band) + 3px)}.keyline{fill:none;stroke:var(--pale);stroke-width:calc(var(--band) + 1.4px)}
.pigment{fill:none;stroke:var(--colour);stroke-width:var(--band)}.mass{fill:var(--colour);stroke:none}
.field{--colour:var(--field);opacity:.86}.motif{--colour:var(--motif);opacity:1}.detail{--colour:var(--detail);opacity:calc(.8 * var(--detail-strength))}
.detail .edge{stroke-width:2.6px}.detail .keyline{stroke-width:1.7px}.detail .pigment{stroke-width:1px}
.motif .edge{stroke-width:calc(var(--band) * .55 + 3px)}.motif .keyline{stroke-width:calc(var(--band) * .55 + 1.4px)}.motif .pigment{stroke-width:calc(var(--band) * .55)}
[data-focus=field] .field{opacity:1}[data-focus=field] .motif{opacity:.4}[data-focus=field] .detail{opacity:calc(.4 * var(--detail-strength))}
[data-focus=detail] .field{opacity:.58}[data-focus=detail] .motif{opacity:.48}[data-focus=detail] .detail{opacity:var(--detail-strength)}
[data-view=skeleton] .layer{display:none}[data-view=skeleton] .base{stroke:var(--pale);opacity:.9;stroke-width:1.6}
.anchors{display:none;fill:var(--detail);stroke:var(--ink);stroke-width:1}[data-anchors=true] .anchors{display:block}.frame{fill:none;stroke:var(--gold);stroke-width:1.2}
[data-collection] .detail .edge{stroke-width:calc(var(--band) * .24 + 2px)}
[data-collection] .detail .keyline{stroke-width:calc(var(--band) * .24 + .9px)}
[data-collection] .detail .pigment{stroke-width:calc(var(--band) * .24)}
[data-collection][data-focus=field] .motif{opacity:.62}
[data-collection][data-focus=field] .detail{opacity:.62}
[data-collection][data-focus=detail] .field{opacity:.68}
[data-collection][data-focus=detail] .motif{opacity:.68}
[data-collection][data-focus=detail] .field .mass{opacity:.32}[data-refined][data-focus=detail] .field{opacity:.55}
[data-refined][data-focus=detail] .field .mass{opacity:.16}
[data-refined][data-focus=detail] .motif{opacity:.86}
[data-refined] .detail .edge{stroke-width:calc(var(--band) * .2 + 1.6px)}
[data-refined] .detail .keyline{stroke-width:calc(var(--band) * .2 + .7px)}
[data-refined] .detail .pigment{stroke-width:calc(var(--band) * .2)}
