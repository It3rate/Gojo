<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" role="img" aria-label="A useful gap is not an error — Every supported value is acceptable" font-family="system-ui, sans-serif"><title>A useful gap is not an error — Every supported value is acceptable</title><rect width="700" height="440" fill="#fcfaf4"/><circle cx="176" cy="199" r="105" fill="#e5ece6" stroke="#16776c" stroke-width="3"/><circle cx="176" cy="199" r="83" fill="#f5ddc7" stroke="#bb622f" stroke-width="3"/><text x="176" y="205" fill="#bb622f" font-size="24" text-anchor="middle">bolt</text><text x="176" y="345" fill="#61756e" font-size="15" text-anchor="middle">Gap enlarged for visibility</text><rect x="340" y="70" width="290" height="80" rx="12" fill="#e7eeea"/><text x="358" y="99" fill="#61756e" font-size="14" text-anchor="start">SUPPORTED CLEARANCE</text><text x="358" y="128" fill="#16776c" font-size="22" text-anchor="start">0.10…0.30 mm</text><text x="340" y="201" fill="#61756e" font-size="16" text-anchor="start">Actual support</text><path d="M425 225 L595 225" fill="none" stroke="#16776c" stroke-width="11"/><text x="340" y="269" fill="#61756e" font-size="16" text-anchor="start">Allowed clearance</text><path d="M425 293 L595 293" fill="none" stroke="#bb622f" stroke-width="11"/><text x="340" y="350" fill="#16776c" font-size="18" text-anchor="start">All supported states fit</text></svg>